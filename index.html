<style>
:root{
  --bg:#101216; --surface:#191C22; --surface2:#212630; --line:#2E343F;
  --text:#EDEFF2; --muted:#8B93A1; --faint:#5C6472;
  --accent:#F2B03C; --accent-dim:#4A3A18; --ok:#4FB477; --warn:#E2603F; --blue:#4A8FE7;
  --r:14px;
  --fd:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --nav:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--fd);
  font-size:16px;line-height:1.45;padding-bottom:var(--nav);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font-family:inherit;font-size:16px;color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{padding:calc(env(safe-area-inset-top) + 18px) 16px 10px;max-width:560px;margin:0 auto}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
h1 .dot{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
h2{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tight{padding:13px 15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#191308;border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);border-color:#43281F}
.btn+.btn{margin-top:10px}
.btn:active{opacity:.72}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.mono{font-family:var(--fm)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-dim);color:var(--accent)}
.tag.home{background:#16303C;color:#5FB6D6}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(16,18,22,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav .inner{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;padding:9px 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
.view{display:none}
.view.on{display:block}

/* séance */
.exhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.exname{font-weight:650;font-size:17px;letter-spacing:-.01em}
.exnum{font-family:var(--fm);font-size:12px;color:var(--faint)}
.goal{background:var(--surface2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:13px}
.goal .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.goal .v{font-size:15px;margin-top:2px}
.goal .h{font-size:12px;color:var(--muted);margin-top:3px}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:8px}
.setlab{width:26px;font-family:var(--fm);font-size:12px;color:var(--faint);flex:none}
.fld{flex:1;position:relative}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 44px 12px 12px;font-family:var(--fm);font-size:17px;text-align:left;-webkit-appearance:none}
.fld input:focus{outline:none;border-color:var(--accent)}
.fld .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);pointer-events:none}
.effort{margin-top:14px}
.effort .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:7px}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:11px 4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);color:#191308;border-color:var(--accent)}
.bar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(16,18,22,0),var(--bg) 34%);padding:18px 0 8px}

/* divers */
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.hist{border-bottom:1px solid var(--line);padding:12px 0}
.hist:last-child{border-bottom:none}
.chg{font-family:var(--fm);font-size:13px}
.up{color:var(--ok)} .down{color:var(--warn)} .same{color:var(--muted)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--fm)}
.field input:focus{outline:none;border-color:var(--accent)}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:14.5px}
.pill{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);flex:none;background:var(--surface)}
.pill:active{opacity:.65}
.sheet{position:fixed;inset:0;background:rgba(8,9,12,.74);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:16px calc(16px + env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom))}
.sheet .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:420px}
.sheet .t{font-weight:650;font-size:17.5px;letter-spacing:-.01em;margin-bottom:6px}
.sheet.demo{align-items:center}
.sheet.demo .box{max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.demo-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:15px 0 4px}
.demo-p{font-size:14px;color:var(--muted);line-height:1.5}
.info{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;flex:none;display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
.info:active{opacity:.6}
.sheet .m{font-size:14px;color:var(--muted);line-height:1.52;margin-bottom:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 16px);background:var(--surface2);border:1px solid var(--line);padding:11px 17px;border-radius:11px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warnbox{background:#2A1D16;border:1px solid #4A3123;border-radius:11px;padding:12px 14px;font-size:13.5px;color:#E9C4A8;margin-bottom:12px}
.ver{text-align:center;color:var(--faint);font-size:11px;font-family:var(--fm);padding:22px 0 8px}
svg.spark{width:100%;height:64px;display:block;margin-top:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function ptsOf(p, keys){ return keys.map(k => p[k][0] + "," + p[k][1]).join(" "); }
function animOn(){ return !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
function animP(a,b){ return animOn() ? '<animate attributeName="points" dur="3s" repeatCount="indefinite" keyTimes="0;0.45;1" values="' + a + ';' + b + ';' + a + '"/>' : ""; }
function animA(n,a,b){ return animOn() ? '<animate attributeName="' + n + '" dur="3s" repeatCount="indefinite" keyTimes="0;0.45;1" values="' + a + ';' + b + ';' + a + '"/>' : ""; }

function drawDemo(id){
  const d = DEMO[id];
  if(!d) return "";
  const BC = "#F2B03C", MC = "#39404D";
  let s = '<svg viewBox="0 0 220 176" style="width:100%;height:auto;background:#13161D;border-radius:12px;display:block" aria-hidden="true">';
  s += d.fixed.replace(/\$M/g, MC);
  if(d.move){
    const m = d.move;
    s += '<line x1="' + m[0] + '" y1="' + m[1] + '" x2="' + m[2] + '" y2="' + m[3] + '" stroke="' + MC + '" stroke-width="7" stroke-linecap="round">' +
      animA("x1",m[0],m[4]) + animA("y1",m[1],m[5]) + animA("x2",m[2],m[6]) + animA("y2",m[3],m[7]) + '</line>';
  }
  const seg = (keys, w) => {
    if(keys.some(k => !d.A[k] || !d.B[k])) return "";
    const a = ptsOf(d.A, keys), b = ptsOf(d.B, keys);
    return '<polyline points="' + a + '" fill="none" stroke="' + BC + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round">' + animP(a,b) + '</polyline>';
  };
  s += seg(["hip","knee","ankle"], 7) + seg(["hip","knee2","ankle2"], 7);
  s += seg(["hip","sh"], 8);
  s += seg(["sh","elb","hand"], 5.5) + seg(["sh","elb2","hand2"], 5.5);
  s += '<circle cx="' + d.A.head[0] + '" cy="' + d.A.head[1] + '" r="9.5" fill="' + BC + '">' +
       animA("cx", d.A.head[0], d.B.head[0]) + animA("cy", d.A.head[1], d.B.head[1]) + '</circle>';
  return s + '</svg>';
}

function openDemo(id){

function load(){
  try{

    return Object.assign(blank(), o);
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Sauvegarde impossible. Exporte tes données."); }
}
function defOf(id){
  for(const t of ["gym","home"]) for(const d of PROGRAM[t]) for(const e of d.ex) if(e.id===id) return e;
  return null;
}
function stOf(id){
  if(!S.ex[id]){
    const d = defOf(id);
    S.ex[id] = d.lv ? {lvl:0, target:d.lo} : {w:d.w, target:d.lo};
  }
  return S.ex[id];
}
const isBW = d => !!d.lv;
const fmtW = w => (Math.round(w*10)/10).toString().replace(".",",");
const dateFR = iso => new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const dateLong = iso => new Date(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ask(o){
  const d = document.createElement("div");
  d.className = "sheet";
  d.innerHTML = '<div class="box"><div class="t">' + esc(o.title) + '</div><div class="m">' + esc(o.msg) + '</div>' +
    '<button class="btn ' + (o.danger ? "danger" : "primary") + '" data-k="ok">' + esc(o.ok) + '</button>' +
    '<button class="btn ghost" data-k="no">' + esc(o.cancel || "Revenir en arrière") + '</button></div>';

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2600);
}

/* ---------- progression ---------- */
function progress(def, st, minReps, effort){
  const hard = effort === "fond";
  const easy = effort === "facile";
  const out = {};

  if(minReps >= def.hi && !hard){
    if(isBW(def)){
      if(st.lvl < def.lv.length - 1){
        st.lvl++; st.target = def.lo;
        out.txt = "Haut de la fourchette atteint sans forcer : on passe à la variante supérieure et on repart de " + def.lo + " reps.";
      }else{
        st.target = def.hi;
        out.txt = "Dernière variante, haut de fourchette tenu. On maintient et on cherche la qualité d'exécution.";
      }
    }else{
      st.w = Math.round((st.w + def.inc)*10)/10; st.target = def.lo;
      out.txt = "Haut de la fourchette atteint sans forcer : +" + fmtW(def.inc) + " kg, et l'objectif repart à " + def.lo + " reps.";
    }
  }
  else if(minReps >= def.hi && hard){
    st.target = def.hi;
    out.txt = "Haut de la fourchette atteint, mais à fond. On garde " + (isBW(def) ? "la même variante" : "la même charge") + " une séance de plus pour consolider.";
  }
  else if(minReps >= st.target){
    const nt = Math.min(minReps + 1, def.hi);
    out.txt = nt > st.target
      ? "Objectif tenu. Le minimum passe à " + nt + " reps, " + (isBW(def) ? "même variante" : "même charge") + "."
      : "Objectif tenu. On reste sur " + nt + " reps.";
    st.target = nt;
  }
  else if(minReps < st.target - 2){
    if(!isBW(def) && st.w > def.inc){
      st.w = Math.round((st.w - def.inc)*10)/10; st.target = def.lo;
      out.txt = "Nettement sous l'objectif : −" + fmtW(def.inc) + " kg pour retrouver une exécution propre.";
    }else if(isBW(def) && st.lvl > 0){
      st.lvl--; st.target = def.lo;
      out.txt = "Nettement sous l'objectif : retour à la variante précédente.";
    }else{
      st.target = Math.max(def.lo, minReps);
      out.txt = "Objectif ajusté vers le bas, on repart d'une base tenable.";
    }
  }
  else{
    out.txt = "Un peu court. On refait la même chose la prochaine fois pour valider.";
  }
  return out;
}

/* ---------- séance ---------- */
function startSession(type){
  const day = type === "gym" ? PROGRAM.gym[S.gymIdx%3] : PROGRAM.home[S.homeIdx%3];
  draft = { type, key:day.key, title:day.title, date:new Date().toISOString(),
    entries: day.ex.map(e => {
      const st = stOf(e.id);
      return { id:e.id, sets:Array.from({length:e.sets}, () => ({reps:null, w:isBW(e)?null:st.w})), effort:null };
    }) };
  render(); window.scrollTo(0,0);
}

function viewSession(){
  const day = (draft.type==="gym"?PROGRAM.gym:PROGRAM.home).find(d => d.key===draft.key);
  let s = '<header class="top"><div class="row"><div><h1 style="font-size:21px">' + esc(day.title.split("— ")[1]) + '</h1>' +
    '<div class="sub">' + (draft.type==="gym"?"Salle":"Maison") + ' ' + draft.key + ' · ' + dateLong(draft.date) + '</div></div>' +
    '<button class="pill" id="abort">Annuler</button></div></header><div class="wrap">';

  day.ex.forEach((e, i) => {
    const st = stOf(e.id), en = draft.entries[i];
    s += '<div class="card"><div class="exhead"><span class="exname">' + esc(e.name) +
      '<button class="info" data-demo="' + e.id + '" aria-label="Comment faire cet exercice">?</button></span>' +
      '<span class="exnum">' + (i+1) + '/' + day.ex.length + '</span></div>';
    s += '<div class="goal"><div class="l">Objectif</div><div class="v">' +
      (isBW(e)
        ? 'Minimum <strong>' + st.target + ' reps</strong> × ' + e.sets + ' séries'
        : 'Minimum <strong>' + st.target + ' reps</strong> × ' + e.sets + ' séries · <strong>' + fmtW(st.w) + ' kg</strong>') +
      '</div><div class="h">' + (isBW(e) ? esc(e.lv[st.lvl]) + ' · ' : '') + 'fourchette ' + e.lo + '–' + e.hi + ' reps' + '</div></div>';

    s += '<div class="sets">';
    for(let k=0;k<e.sets;k++){
      s += '<div class="setrow"><span class="setlab">S' + (k+1) + '</span>' +
        '<div class="fld"><input inputmode="numeric" data-e="' + i + '" data-s="' + k + '" data-f="reps" placeholder="—"><span class="u">reps</span></div>' +
        (isBW(e) ? '' : '<div class="fld"><input inputmode="decimal" data-e="' + i + '" data-s="' + k + '" data-f="w" value="' + fmtW(st.w) + '"><span class="u">kg</span></div>') +
        '</div>';
    }
    s += '</div>';
    s += '<div class="effort"><div class="l">Ressenti sur la dernière série</div><div class="seg">' +
      ['facile','correct','fond'].map(v =>
        '<button data-eff="' + i + '" data-v="' + v + '"' + (en.effort===v?' class="on"':'') + '>' +
        (v==="facile"?"Facile":v==="correct"?"Correct":"À fond") + '</button>').join("") + '</div></div>';
    s += '</div>';
  });

  s += '<div class="bar"><button class="btn primary" id="finish">Terminer la séance</button></div></div>';
  return s;
}

function bindSession(){
  document.getElementById("abort").onclick = () => ask({
    title:"Annuler la séance ?",
    msg:"Les séries déjà saisies seront perdues et tes objectifs resteront inchangés.",
    ok:"Annuler la séance", cancel:"Continuer la séance", danger:true,
    onOk:() => { draft = null; render(); window.scrollTo(0,0); }
  });
  document.querySelectorAll("input[data-e]").forEach(inp => {
    inp.oninput = () => {
      const e = +inp.dataset.e, k = +inp.dataset.s, f = inp.dataset.f;
      const val = parseFloat(inp.value.replace(",", "."));
      draft.entries[e].sets[k][f] = isNaN(val) ? null : val;
    };
  });
  document.querySelectorAll("button[data-eff]").forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.eff;
      draft.entries[i].effort = b.dataset.v;
      b.parentNode.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
    };
  });
  document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => openDemo(b.dataset.demo));
  document.getElementById("finish").onclick = finish;
}

function finish(){
  const done = draft.entries.filter(en => en.sets.some(x => x.reps != null));
  if(!done.length){ toast("Saisis au moins une série avant de terminer."); return; }
  const noEffort = done.filter(en => !en.effort).length;
  if(noEffort){
    ask({
      title:"Ressenti manquant",
      msg:noEffort + (noEffort > 1 ? " exercices n'ont" : " exercice n'a") + " pas de ressenti. Sans lui, l'objectif de la prochaine séance ne peut pas être recalculé : il restera identique.",
      ok:"Terminer quand même", cancel:"Compléter les ressentis", onOk:finalize
    });
    return;
  }
  finalize();
}

function finalize(){
  const results = [];
  draft.entries.forEach(en => {
    const def = defOf(en.id), st = stOf(en.id);
    const reps = en.sets.map(x => x.reps).filter(r => r != null);
    if(!reps.length) return;
    const wUsed = en.sets.map(x => x.w).filter(v => v != null);
    if(!isBW(def) && wUsed.length) st.w = wUsed[wUsed.length-1];
    const before = isBW(def) ? def.lv[st.lvl] : fmtW(st.w) + " kg";
    const beforeT = st.target;
    const r = en.effort ? progress(def, st, Math.min(...reps), en.effort) : {txt:"Pas de ressenti indiqué : objectif inchangé."};
    results.push({ name:def.name, before, beforeT, after: isBW(def) ? def.lv[st.lvl] : fmtW(st.w) + " kg", afterT:st.target, txt:r.txt });
  });

  S.sessions.push({ date:draft.date, type:draft.type, key:draft.key,
    entries: draft.entries.filter(en => en.sets.some(x => x.reps != null))
      .map(en => ({ id:en.id, effort:en.effort, sets:en.sets.filter(x => x.reps != null) })) });
  if(draft.type === "gym") S.gymIdx++; else S.homeIdx++;
  draft = null; save();
  showSummary(results);
}

function showSummary(res){
  const app = document.getElementById("app");
  app.innerHTML = '<header class="top"><h1 style="font-size:23px">Séance enregistrée</h1>' +
    '<div class="sub">Voici les objectifs recalculés pour la prochaine fois</div></header><div class="wrap">' +
    res.map(r =>
      '<div class="card"><div class="exname" style="margin-bottom:8px">' + esc(r.name) + '</div>' +
      '<div class="row" style="margin-bottom:9px"><span class="mono small muted">' + esc(r.before) + ' · ' + r.beforeT + ' reps</span>' +
      '<span class="mono small ' + (r.after!==r.before || r.afterT>r.beforeT ? "up" : "same") + '">→ ' + esc(r.after) + ' · ' + r.afterT + ' reps</span></div>' +
      '<div class="note">' + esc(r.txt) + '</div></div>').join("") +
    '<div class="bar"><button class="btn primary" id="back">Retour à l\'accueil</button></div></div>';
  document.getElementById("back").onclick = () => { tab = "home"; render(); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

/* ---------- export / import ---------- */
async function doExport(){
  const data = JSON.stringify(S, null, 2);
  const name = "stack-" + new Date().toISOString().slice(0,10) + ".json";
  const file = new File([data], name, {type:"application/json"});
  S.lastExport = new Date().toISOString(); save();
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:"Sauvegarde Stack"}); render(); return; }catch(e){}
  }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Sauvegarde créée."); render();
}
function doImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const o = JSON.parse(fr.result);
      if(!o || !Array.isArray(o.sessions)) throw new Error("format");
      ask({
        title:"Restaurer cette sauvegarde ?",
        msg:"Tes données actuelles (" + S.sessions.length + " séances) seront remplacées par celles du fichier (" + o.sessions.length + " séances).",
        ok:"Restaurer", cancel:"Ne rien changer", danger:true,
        onOk:() => { S = Object.assign(blank(), o); save(); tab = "home"; render(); toast("Sauvegarde restaurée."); }
      });
    }catch(e){ toast("Fichier illisible. Choisis un export Stack."); }
  };
  fr.readAsText(file);
}

/* ---------- liaisons ---------- */
function bindMain(){
  document.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startSession(b.dataset.start));
  document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => openDemo(b.dataset.demo));

  const ms = document.getElementById("m-save");
  if(ms) ms.onclick = () => {
    const get = id => {
      const v = parseFloat((document.getElementById(id).value||"").replace(",", "."));
      return isNaN(v) ? null : v;
    };
    const m = {date:new Date().toISOString(), poids:get("m-poids"), taille:get("m-taille"),
      poitrine:get("m-poitrine"), bras:get("m-bras"), cuisse:get("m-cuisse")};
    if(m.poids==null && m.taille==null && m.poitrine==null && m.bras==null && m.cuisse==null){
      toast("Remplis au moins une valeur."); return;
    }
    S.measures.push(m); save(); render(); toast("Mesure enregistrée.");
  };

  const ex = document.getElementById("exp");
  if(ex){
    ex.onclick = doExport;
    document.getElementById("imp").onclick = () => document.getElementById("impfile").click();
    document.getElementById("impfile").onchange = e => { if(e.target.files[0]) doImport(e.target.files[0]); };
    document.getElementById("reset").onclick = () => ask({
      title:"Effacer toutes les données ?",
      msg:"Séances, charges et mesures seront supprimées définitivement. Cette action ne peut pas être annulée.",
      ok:"Effacer définitivement", cancel:"Ne rien effacer", danger:true,
      onOk:() => { S = blank(); save(); tab = "home"; render(); toast("Données effacées."); }
    });
  }
}

document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    if(draft){ toast("Termine ou annule la séance en cours."); return; }
    tab = b.dataset.tab;
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    render(); window.scrollTo(0,0);
  };
});

render();
</script>
